# See the properties reference:
# https://docs.micronaut.io/5.2.x/configuration-reference/

## -------------------- General -------------------- ##
## ------------------------------------------------- ##

micronaut.application.name=moodleapiclient

# Moodle Docker is running at 8080; so use port 8085 for the API Client
micronaut.server.port=8085

## -------------------- Database -------------------- ##
## -------------------------------------------------- ##

datasources.default.dialect=H2
datasources.default.driver-class-name=org.h2.Driver
datasources.default.username=sa
datasources.default.password=

datasources.default.url=jdbc\:h2\:mem\:devDb;LOCK_TIMEOUT\=10000;DB_CLOSE_ON_EXIT\=FALSE
datasources.default.schema-generate=CREATE_DROP

# Enable Flyway DB migrations
flyway.datasources.default.enabled=true
