# See the properties reference:
# https://docs.micronaut.io/5.2.x/configuration-reference/

## -------------------- General -------------------- ##
## ------------------------------------------------- ##

micronaut.application.name=moodleapiclient

# Moodle Docker is running at 8080; so use port 8085 for the API Client
micronaut.server.port=8085

# Moodle web service API address
micronaut.http.services.moodle-api.url=http://localhost:8080

# Moodle web service API access token
# NOTE: There must be a SINGLE token for all web service functions
external.moodle-api.access-token=bbee215e2380a57b7ab0c319ef0790d3

# Enable Micronaut HTTP logging for debugging
micronaut.http.client.log-level=TRACE

## -------------------- Database -------------------- ##
## -------------------------------------------------- ##

datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.username=moodleapiuser
datasources.default.password=1234

datasources.default.url=jdbc:postgresql://localhost:5432/moodle_api_testing

# Disable Micronaut's default schema generation; let Flyway own the schema
datasources.default.schema-generate=NONE

# Enable Flyway DB migrations
flyway.datasources.default.enabled=true

# Point Flyway at the database migrations directory
flyway.datasources.default.locations=classpath:db/migration
